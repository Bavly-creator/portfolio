<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, World</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3a8a, #7c3aed);
      color: #fff;
      text-align: center;
      padding: 1rem;
    }
    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 2.5rem 3rem;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }
    h1 { font-size: 2.2rem; margin-bottom: 0.75rem; }
    p { opacity: 0.9; line-height: 1.5; margin-bottom: 1.5rem; }
    button {
      background: #fff;
      color: #4c1d95;
      border: none;
      border-radius: 999px;
      padding: 0.7rem 1.6rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    button:hover { transform: scale(1.05); }
    #clock { margin-top: 1.25rem; font-size: 0.95rem; opacity: 0.8; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello, World 👋</h1>
    <p>This is a simple starter page. Edit this file to make it your own.</p>
    <button id="btn">Click me</button>
    <div id="clock"></div>
  </main>

  <script>
    const btn = document.getElementById('btn');
    let count = 0;
    btn.addEventListener('click', () => {
      count++;
      btn.textContent = `Clicked ${count} time${count === 1 ? '' : 's'}`;
    });

    const clock = document.getElementById('clock');
    function tick() {
      clock.textContent = new Date().toLocaleTimeString();
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
